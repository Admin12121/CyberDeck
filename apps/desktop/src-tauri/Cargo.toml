[package]
name = "hacktool-desktop"
description = "HackTool desktop shell (Tauri 2) — typed IPC, job manager, packaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
hacktool-core = { path = "../../../crates/core" }
hacktool-crypto = { path = "../../../crates/crypto" }
hacktool-packet = { path = "../../../crates/packet" }
hacktool-storage = { path = "../../../crates/storage" }
base64 = "0.22"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
