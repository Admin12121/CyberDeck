[package]
name = "cyberdeck-desktop"
description = "CyberDeck desktop shell (Tauri 2) — typed IPC, job manager, packaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
cyberdeck-core = { path = "../../../crates/core" }
cyberdeck-crypto = { path = "../../../crates/crypto" }
cyberdeck-packet = { path = "../../../crates/packet" }
cyberdeck-storage = { path = "../../../crates/storage" }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
time = { version = "0.3", features = ["serde-well-known"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { workspace = true }
tokio-util = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
