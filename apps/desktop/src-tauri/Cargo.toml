[package]
name = "hacktool-desktop"
description = "HackTool desktop shell (Tauri 2) — typed IPC, job manager, packaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
hacktool-core = { path = "../../../crates/core" }
hacktool-crypto = { path = "../../../crates/crypto" }
hacktool-packet = { path = "../../../crates/packet" }
hacktool-storage = { path = "../../../crates/storage" }
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
time = { version = "0.3", features = ["serde-well-known"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
