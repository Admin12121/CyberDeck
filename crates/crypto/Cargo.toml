[package]
name = "cyberdeck-crypto"
description = "Native crypto and transformation operations (Master Plan section 5.4/5.5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:libloading"]

[dependencies]
aes-gcm = "0.10.3"
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
bcrypt = "0.15"
crc32fast = "1"
flate2 = "1"
hex = "0.4"
libloading = { version = "0.8", optional = true }
hmac = "0.12"
md4 = "0.11"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
scrypt = { version = "0.11", features = ["simple"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
yescrypt = { version = "0.1.0", features = ["password-hash"] }
sha-crypt = "0.6"
pwhash = "1.0"
des = "0.8"
ripemd = "0.1"
whirlpool = "0.10"
blake2 = "0.10"
